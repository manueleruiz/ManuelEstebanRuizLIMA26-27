<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Manuel">
    <title>Listas I</title>
</head>
<body>
    <h2><strong>Lista Desordenada</strong></h2>
    <ul>
        <li>Cafe</li>
        <li>Agua</li>
        <li>Leche</li>
    </ul>
    <h2><strong>Lista Ordenada</strong></h2>
    <ol>
        <li>Cafe</li>
        <li>Agua</li>
        <li>Leche</li>
    </ol>
    <h2><strong>Lista Mixta</strong></h2>
    <ul>
        <li>Cafe</li>
        <ol>
            <li>Solo</li>
            <li>Con leche</li>
            <ol>
                <li>Latte</li>
                <li>Capuccino</li>
            </ol>
        </ol>
        <li>Agua</li>
        <li>Leche</li>
    </ul>

    <h2><strong>Lista de Definicion</strong></h2>
    <dl>
        <dt>Coche</dt>
        <dd>Vehiculo de 4 ruedas</dd>
        <dt>Moto</dt>
        <dd>Vehiculo de 2 ruedas</dd>
    </dl>


    
</body>
</html>
