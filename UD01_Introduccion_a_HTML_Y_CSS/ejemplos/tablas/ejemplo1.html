<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Manuel">
    <title>Ejemplo de tabla basica</title>
</head>

<body>
    <table border="1">
        <caption>Este es el titulo de la tabla</caption>
        <thead><!--Filas que forman parte del encabezado de la tabla -->
            <tr><!--tr es Table Row -->
                <th scope="col">Encabezado columna 1</th>
                <th scope="col">Encabezado de la columna 2</th>
                <th scope="col">Encabezado de la columna 3</th>
            </tr>
        </thead>
        <tbody>
            <!--Filas que forman parte del cuerpo de la tabla -->
            <tr>
                <th scope="row">Esto encabeza una fila y es correcto.</th>
                <td>Esto es un dato</td>
                <td>Esto es otro dato</td>
            </tr>
            <tr>
                <th scope="row">Encabezado de la fila 2</th>
                <td>Primer dato de la fila 2</td>
                <td>Segundo dato de la fila 2</td>
            </tr>
        </tbody>
        <tfoot>
            <!--Filas que forman parte del pie de la tabla -->
            <tr>
                <th>Encabezado</th>
                <td>dato 2</td>
                <td>dato 3</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
